[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "S101", 
    "B008", 
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]          

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]       
addopts = "-ra"          
markers = [
    "integration: necesita Docker (levanta PostgreSQL 16 con testcontainers)",
]