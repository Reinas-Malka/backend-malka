
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Formato
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Tipos
        run: mypy

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

   
      - name: Pytest con cobertura
        run: pytest -m "not integration" --cov=app --cov-report=term-missing

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Formato
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  imagen:
    name: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --provenance=false --sbom=false -t malka-backend:ci .